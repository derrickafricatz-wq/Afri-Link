<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>In-Charge Seat Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
  background:#07111f;
  color:#ffffff;
}


/* =========================================
   HEADER
========================================= */

.dashboardHeader{
  padding:22px 15px;
  background:#0d1b2a;
  text-align:center;
  border-bottom:1px solid rgba(0,255,255,.2);
}

.dashboardHeader h1{
  margin:0;
  color:#00ffff;
  font-size:22px;
  font-weight:900;
}

.dashboardHeader p{
  margin:8px 0 0;
  color:#aebdca;
  font-size:14px;
}


/* =========================================
   CONTAINER
========================================= */

.dashboardContainer{
  width:100%;
  max-width:1000px;
  margin:auto;
  padding:20px;
}


/* =========================================
   TOP BAR
========================================= */

.dashboardTopBar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:12px;
}

.dashboardTitle{
  font-size:18px;
  font-weight:900;
  color:#00ffff;
}

.refreshButton{
  border:none;
  padding:12px 18px;
  border-radius:10px;
  background:#00ffff;
  color:#001015;
  font-weight:900;
  cursor:pointer;
}

.refreshButton:active{
  transform:scale(.97);
}

.refreshButton:disabled{
  opacity:.6;
  cursor:not-allowed;
}


/* =========================================
   LAST UPDATED
========================================= */

.lastUpdated{
  width:100%;
  margin-bottom:20px;
  padding:10px 12px;
  background:rgba(0,255,255,.06);
  border:1px solid rgba(0,255,255,.12);
  border-radius:10px;
  color:#8fa3b8;
  font-size:12px;
  text-align:center;
}

.lastUpdated span{
  color:#00ff88;
  font-weight:900;
}


/* =========================================
   REQUEST CARD
========================================= */

.requestCard{
  background:#0d1b2a;
  border-radius:15px;
  padding:20px;
  margin-bottom:18px;
  border:1px solid rgba(0,255,255,.18);
  box-shadow:0 8px 25px rgba(0,0,0,.25);
}

.requestHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.requestHeader h3{
  margin:0;
  color:#ffffff;
  font-size:17px;
}

.statusBadge{
  padding:7px 12px;
  border-radius:20px;
  background:rgba(255,193,7,.15);
  border:1px solid rgba(255,193,7,.4);
  color:#ffc107;
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
}


/* =========================================
   REQUEST INFORMATION
========================================= */

.infoGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.infoBox{
  background:rgba(255,255,255,.04);
  border-radius:10px;
  padding:12px;
}

.infoLabel{
  display:block;
  color:#8fa3b8;
  font-size:11px;
  margin-bottom:5px;
  text-transform:uppercase;
}

.infoValue{
  color:#ffffff;
  font-size:14px;
  font-weight:700;
  word-break:break-word;
}


/* =========================================
   SEAT MANAGEMENT
========================================= */

.seatManagement{
  margin-top:20px;
  padding-top:18px;
  border-top:1px solid rgba(0,255,255,.15);
}

.seatTitle{
  color:#00ffff;
  font-size:13px;
  font-weight:900;
  margin-bottom:10px;
}

.seatInput{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  margin-bottom:10px;
  background:#ffffff;
  color:#000000;
  font-size:14px;
  outline:none;
}

.seatInput:focus{
  box-shadow:0 0 0 3px rgba(0,255,255,.25);
}

.updateSeatButton{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  background:#00ffff;
  color:#001015;
  font-weight:900;
  cursor:pointer;
}

.updateSeatButton:active{
  transform:scale(.98);
}

.updateSeatButton:disabled{
  opacity:.6;
  cursor:not-allowed;
}


/* =========================================
   SELECTED SEAT
========================================= */

.selectedSeatValue{
  color:#00ff88;
  font-weight:900;
  font-size:15px;
}


/* =========================================
   EMPTY
========================================= */

.emptyMessage{
  text-align:center;
  padding:40px 20px;
  color:#8fa3b8;
  background:#0d1b2a;
  border-radius:15px;
  border:1px solid rgba(0,255,255,.15);
}


/* =========================================
   LOADING
========================================= */

.loadingMessage{
  text-align:center;
  padding:30px;
  color:#00ffff;
}


/* =========================================
   ERROR
========================================= */

.errorMessage{
  text-align:center;
  padding:20px;
  color:#ff6b6b;
  background:rgba(255,0,0,.08);
  border:1px solid rgba(255,0,0,.2);
  border-radius:12px;
  margin-bottom:20px;
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:600px){

  .dashboardContainer{
    padding:14px;
  }

  .dashboardHeader h1{
    font-size:19px;
  }

  .infoGrid{
    grid-template-columns:1fr;
  }

  .dashboardTopBar{
    align-items:stretch;
  }

  .refreshButton{
    width:100%;
  }

}

</style>

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<div class="dashboardHeader">

  <h1>
    IN-CHARGE DASHBOARD
  </h1>

  <p>
    Flight & Bus Seat Management
  </p>

</div>


<!-- =========================================
     MAIN DASHBOARD
========================================= -->

<div class="dashboardContainer">


  <div class="dashboardTopBar">

    <div class="dashboardTitle">
      SEAT REQUESTS
    </div>

    <button
      id="refreshButton"
      class="refreshButton"
      type="button"
      onclick="manualRefresh()"
    >
      REFRESH REQUESTS
    </button>

  </div>


  <!-- LAST UPDATED -->

  <div class="lastUpdated">

    Automatic refresh:
    <span>Every 10 seconds</span>

    &nbsp; | &nbsp;

    Last updated:
    <span id="lastUpdatedTime">
      Not yet
    </span>

  </div>


  <!-- ERROR -->

  <div
    id="errorMessage"
    class="errorMessage"
    style="display:none;"
  ></div>


  <!-- REQUEST LIST -->

  <div id="seatRequestsContainer">

    <div class="loadingMessage">

      Loading seat requests...

    </div>

  </div>


</div>


<script>


// =========================================
// SUPABASE CONNECTION
// =========================================

const SUPABASE_URL =
  "https://xbemkmvvbkxknuduthsg.supabase.co";




const client =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      global:{
        fetch:(
          url,
          options = {}
        ) => {

          return fetch(
            url,
            {
              ...options,
              cache:"no-store"
            }
          );

        }
      }
    }
  );


// =========================================
// SETTINGS
// =========================================

const AUTO_REFRESH_TIME =
  10000;


// =========================================
// STATE
// =========================================

let isLoadingSeatRequests =
  false;

let isUpdatingSeat =
  false;

let autoRefreshTimer =
  null;


// =========================================
// LOAD SEAT REQUESTS
// =========================================

async function loadSeatRequests(
  showLoading = false
){

  // ---------------------------------------
  // PREVENT OVERLAPPING LOADS
  // ---------------------------------------

  if(
    isLoadingSeatRequests
  ){

    console.log(
      "Refresh already running."
    );

    return;

  }


  isLoadingSeatRequests =
    true;


  const container =
    document.getElementById(
      "seatRequestsContainer"
    );


  const errorBox =
    document.getElementById(
      "errorMessage"
    );


  if(
    !container ||
    !errorBox
  ){

    isLoadingSeatRequests =
      false;

    return;

  }


  try{


    // -------------------------------------
    // SHOW LOADING ONLY ON INITIAL LOAD
    // -------------------------------------

    if(
      showLoading
    ){

      container.innerHTML = `

        <div class="loadingMessage">

          Loading seat requests...

        </div>

      `;

    }


    // -------------------------------------
    // GET FRESH DATA
    // -------------------------------------

    const {
      data,
      error
    } = await client

      .from("seat_requests")

      .select("*")

      .order(
        "created_at",
        {
          ascending:false
        }
      );


    // -------------------------------------
    // HANDLE ERROR
    // -------------------------------------

    if(
      error
    ){

      console.error(
        "Seat request loading error:",
        error
      );


      errorBox.textContent =
        "Unable to load seat requests: " +
        error.message;


      errorBox.style.display =
        "block";


      return;

    }


    // -------------------------------------
    // HIDE ERROR
    // -------------------------------------

    errorBox.style.display =
      "none";

    errorBox.textContent =
      "";


    // -------------------------------------
    // NO REQUESTS
    // -------------------------------------

    if(
      !data ||
      data.length === 0
    ){

      container.innerHTML = `

        <div class="emptyMessage">

          No seat requests available yet.

        </div>

      `;

      updateLastRefreshTime();

      return;

    }


    // -------------------------------------
    // BUILD FRESH DASHBOARD
    // -------------------------------------

    const fragment =
      document.createDocumentFragment();


    data.forEach(
      request => {


        const card =
          document.createElement(
            "div"
          );


        card.className =
          "requestCard";


        const selectedSeat =
          request.selected_seat !== null &&
          request.selected_seat !== undefined &&
          String(
            request.selected_seat
          ).trim() !== ""

          ? String(
              request.selected_seat
            ).trim()

          : "";


        const availableSeats =
          request.available_seats !== null &&
          request.available_seats !== undefined

          ? String(
              request.available_seats
            ).trim()

          : "";


        card.innerHTML = `

          <div class="requestHeader">

            <h3>

              ${escapeHTML(
                request.company_name ||
                "Company Not Provided"
              )}

            </h3>


            <div class="statusBadge">

              ${escapeHTML(
                request.status ||
                "pending"
              )}

            </div>

          </div>


          <div class="infoGrid">


            <div class="infoBox">

              <span class="infoLabel">
                Service
              </span>

              <span class="infoValue">

                ${escapeHTML(
                  request.service_type ||
                  "Not provided"
                )}

              </span>

            </div>


            <div class="infoBox">

              <span class="infoLabel">
                Customer
              </span>

              <span class="infoValue">

                ${escapeHTML(
                  request.customer_name ||
                  "Not provided"
                )}

              </span>

            </div>


            <div class="infoBox">

              <span class="infoLabel">
                Phone
              </span>

              <span class="infoValue">

                ${escapeHTML(
                  request.customer_phone ||
                  "Not provided"
                )}

              </span>

            </div>


            <div class="infoBox">

              <span class="infoLabel">
                Passengers
              </span>

              <span class="infoValue">

                ${escapeHTML(
                  String(
                    request.passengers ||
                    "Not provided"
                  )
                )}

              </span>

            </div>


            <div class="infoBox">

              <span class="infoLabel">
                Departure
              </span>

              <span class="infoValue">

                ${escapeHTML(
                  request.departure ||
                  "Not provided"
                )}

              </span>

            </div>


            <div class="infoBox">

              <span class="infoLabel">
                Destination
              </span>

              <span class="infoValue">

                ${escapeHTML(
                  request.destination ||
                  "Not provided"
                )}

              </span>

            </div>


            <div class="infoBox">

              <span class="infoLabel">
                Travel Date
              </span>

              <span class="infoValue">

                ${escapeHTML(
                  request.travel_date ||
                  "Not provided"
                )}

              </span>

            </div>


            <div class="infoBox">

              <span class="infoLabel">
                SELECTED SEATS
              </span>

              <span
                class="infoValue selectedSeatValue"
              >

                ${
                  selectedSeat
                  ? escapeHTML(
                      selectedSeat
                    )
                  : "Not selected yet"
                }

              </span>

            </div>


            <div class="infoBox">

              <span class="infoLabel">
                Request Time
              </span>

              <span class="infoValue">

                ${formatDate(
                  request.created_at
                )}

              </span>

            </div>


          </div>


          <!-- =================================
               AVAILABLE SEATS
          ================================= -->

          <div class="seatManagement">


            <div class="seatTitle">

              AVAILABLE SEATS

            </div>


            <input

              type="text"

              class="seatInput"

              id="availableSeats-${request.id}"

              data-request-id="${request.id}"

              placeholder="Example: 1, 2, 5, 8"

              value="${escapeHTML(
                availableSeats
              )}"

            >


            <button

              type="button"

              class="updateSeatButton"

              id="updateSeat-${request.id}"

              onclick="
                updateAvailableSeats(
                  '${request.id}'
                )
              "

            >

              UPDATE AVAILABLE SEATS

            </button>


          </div>

        `;


        fragment.appendChild(
          card
        );


      }
    );


    // -------------------------------------
    // REPLACE DASHBOARD
    // -------------------------------------

    container.replaceChildren(
      fragment
    );


    updateLastRefreshTime();


    console.log(
      "Dashboard refreshed:",
      data.length,
      "requests"
    );


  }catch(error){


    console.error(
      "Unexpected dashboard error:",
      error
    );


    errorBox.textContent =
      "Dashboard error: " +
      error.message;


    errorBox.style.display =
      "block";


  }finally{


    isLoadingSeatRequests =
      false;

  }

}


// =========================================
// UPDATE AVAILABLE SEATS
// =========================================

async function updateAvailableSeats(
  requestId
){

  if(
    isUpdatingSeat
  ){

    return;

  }


  const input =
    document.getElementById(
      `availableSeats-${requestId}`
    );


  const button =
    document.getElementById(
      `updateSeat-${requestId}`
    );


  if(
    !input
  ){

    alert(
      "Seat input was not found."
    );

    return;

  }


  const availableSeats =
    input.value.trim();


  // =======================================
  // ALLOW EMPTY VALUE
  // EMPTY = CLEAR AVAILABLE + SELECTED
  // =======================================

  isUpdatingSeat =
    true;


  if(
    button
  ){

    button.disabled =
      true;

    button.textContent =
      "UPDATING...";

  }


  try{


    // =====================================
    // FIND CURRENT REQUEST
    // =====================================

    const {
      data: currentRequest,
      error: currentError
    } = await client

      .from("seat_requests")

      .select(
        "selected_seat"
      )

      .eq(
        "id",
        requestId
      )

      .maybeSingle();


    if(
      currentError
    ){

      throw currentError;

    }


    const currentSelectedSeat =
      currentRequest &&
      currentRequest.selected_seat !== null &&
      currentRequest.selected_seat !== undefined

      ? String(
          currentRequest.selected_seat
        ).trim()

      : "";


    // =====================================
    // DETERMINE NEW SELECTED SEAT
    // =====================================

    let newSelectedSeat =
      currentSelectedSeat;


    // -------------------------------------
    // IF AVAILABLE SEATS CLEARED
    // CLEAR SELECTED SEAT TOO
    // -------------------------------------

    if(
      availableSeats === ""
    ){

      newSelectedSeat =
        null;

    }


    // -------------------------------------
    // IF AVAILABLE SEATS CHANGED
    // CHECK WHETHER OLD SELECTED SEAT
    // STILL EXISTS
    // -------------------------------------

    else if(
      currentSelectedSeat !== ""
    ){

      const availableList =
        availableSeats

          .split(",")

          .map(
            seat =>
              seat.trim()
          )

          .filter(
            seat =>
              seat !== ""
          );


      if(
        !availableList.includes(
          currentSelectedSeat
        )
      ){

        newSelectedSeat =
          null;

      }

    }


    // =====================================
    // UPDATE SUPABASE
    // =====================================

    const {
      error: updateError
    } = await client

      .from("seat_requests")

      .update({

        available_seats:
          availableSeats === ""
          ? null
          : availableSeats,

        selected_seat:
          newSelectedSeat,

        status:
          availableSeats === ""
          ? "pending"
          : "seats_available"

      })

      .eq(
        "id",
        requestId );


    if(
      updateError
    ){

      throw updateError;

    }


    // =====================================
    // GET THE EXACT FRESH ROW
    // =====================================

    const {
      data: freshRequest,
      error: freshError
    } = await client

      .from("seat_requests")

      .select("*")

      .eq(
        "id",
        requestId
      )

      .maybeSingle();


    if(
      freshError
    ){

      throw freshError;

    }


    // =====================================
    // UPDATE INPUT WITH ACTUAL DATABASE VALUE
    // =====================================

    if(
      input
    ){

      input.value =
        freshRequest &&
        freshRequest.available_seats !== null &&
        freshRequest.available_seats !== undefined

        ? String(
            freshRequest.available_seats
          ).trim()

        : "";

    }


    alert(
      "Seat availability updated successfully."
    );


    // =====================================
    // REFRESH FULL DASHBOARD
    // =====================================

    await loadSeatRequests(
      false
    );


  }catch(error){


    console.error(
      "Seat update error:",
      error
    );


    alert(
      "Unable to update seats.\n\n" +
      error.message
    );


  }finally{


    isUpdatingSeat =
      false;


    if(
      button
    ){

      button.disabled =
        false;

      button.textContent =
        "UPDATE AVAILABLE SEATS";

    }

  }

}


// =========================================
// MANUAL REFRESH
// =========================================

async function manualRefresh(){

  const button =
    document.getElementById(
      "refreshButton"
    );


  if(
    button
  ){

    button.disabled =
      true;

    button.textContent =
      "REFRESHING...";

  }


  try{

    await loadSeatRequests(
      false
    );

  }finally{

    if(
      button
    ){

      button.disabled =
        false;

      button.textContent =
        "REFRESH REQUESTS";

    }

  }

}


// =========================================
// LAST REFRESH TIME
// =========================================

function updateLastRefreshTime(){

  const element =
    document.getElementById(
      "lastUpdatedTime"
    );


  if(
    !element
  ){

    return;

  }


  element.textContent =
    new Date().toLocaleTimeString();

}


// =========================================
// ESCAPE HTML
// =========================================

function escapeHTML(
  value
){

  return String(
    value
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


// =========================================
// FORMAT DATE
// =========================================

function formatDate(
  value
){

  if(
    !value
  ){

    return "Not provided";

  }


  const date =
    new Date(
      value
    );


  if(
    isNaN(
      date.getTime()
    )
  ){

    return "Not provided";

  }


  return date.toLocaleString();

}


// =========================================
// START DASHBOARD
// =========================================

async function startDashboard(){

  // ---------------------------------------
  // FIRST LOAD
  // ---------------------------------------

  await loadSeatRequests(
    true
  );


  // ---------------------------------------
  // AUTO REFRESH EVERY 10 SECONDS
  // ---------------------------------------

  if(
    autoRefreshTimer
  ){

    clearInterval(
      autoRefreshTimer
    );

  }


  autoRefreshTimer =
    setInterval(
      function(){

        loadSeatRequests(
          false
        );

      },
      AUTO_REFRESH_TIME
    );


  console.log(
    "Automatic refresh started: every 10 seconds."
  );

}


// =========================================
// RUN
// =========================================

startDashboard();


</script>


</body>

</html>
